# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: E2E Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
permissions:
  actions: read
  contents: read
jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - name: Run E2E tests
        run: bash tests/e2e.sh
